name: Notify self-healing backend

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      !startsWith(github.event.workflow_run.head_branch, 'prpatch/') &&
      (github.event.workflow_run.event == 'push' ||
      (github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].base.ref == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    steps:
      - name: Send failed run to backend
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$WEBHOOK_URL" || { echo "WEBHOOK_URL secret is missing"; exit 1; }
          test -n "$WEBHOOK_SECRET" || { echo "WEBHOOK_SECRET secret is missing"; exit 1; }

          payload="$(jq -c \
            --arg repo "$REPOSITORY" \
            '.workflow_run as $run |
             ($run.pull_requests[0] // {}) as $pr |
             {
               repo: $repo,
               run_id: ($run.id | tostring),
               branch: (if $run.event == "pull_request" then ($pr.head.ref // $run.head_branch) else $run.head_branch end),
               head_sha: (if $run.event == "pull_request" then ($pr.head.sha // $run.head_sha) else $run.head_sha end),
               target_branch: (if $run.event == "pull_request" then ($pr.head.ref // $run.head_branch) else $run.head_branch end)
             }' "$GITHUB_EVENT_PATH")"

          curl --fail --show-error --silent \
            --retry 3 --retry-delay 2 \
            --request POST "$WEBHOOK_URL" \
            --header "Authorization: Bearer $WEBHOOK_SECRET" \
            --header "Content-Type: application/json" \
            --data "$payload"
